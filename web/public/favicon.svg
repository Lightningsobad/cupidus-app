<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Mirrors the header logo mark (SiteHeader.astro:18): a rounded square in
       the brand gradient with the white `favorite` heart. The gradient stops
       and angle are the token values #FF7FB6 -> #B78CF5 at 140deg; the
       endpoints below are that CSS angle resolved for a square box. -->
  <defs>
    <linearGradient id="cupid-favicon-brand" x1="0.047" y1="-0.04" x2="0.953" y2="1.04">
      <stop offset="0" stop-color="#FF7FB6"/>
      <stop offset="1" stop-color="#B78CF5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="11.3" fill="url(#cupid-favicon-brand)"/>
  <path transform="translate(16 16.6) scale(0.66) translate(-16 -16.6)" fill="#fff" d="M16 28C16 28 4 20.8 4 12.8C4 8.6 7.4 5.2 11.6 5.2C13.6 5.2 15.2 6.2 16 7.6C16.8 6.2 18.4 5.2 20.4 5.2C24.6 5.2 28 8.6 28 12.8C28 20.8 16 28 16 28Z"/>
