<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
<svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">

<path d="M29 46 C29 24 71 24 71 46"></path>
</g>
</sc-if>
<sc-if value="{{ isGemini }}">

<sc-if value="{{ isLeo }}">

</g>
</sc-if>

<path d="M26 70 L26 38 Q26 31 31.5 31 Q37 31 37 38 L37 70"></path>
<path d="M37 38 Q37 31 42.5 31 Q48 31 48 38 L48 62"></path>

</sc-if>
<sc-if value="{{ isScorpio }}">
<g stroke="{{ ink }}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M22 70 L22 38 Q22 31 27.5 31 Q33 31 33 38 L33 70"></path>
<path d="M33 38 Q33 31 38.5 31 Q44 31 44 38 L44 70"></path>
<path d="M44 38 Q44 31 49.5 31 Q55 31 55 38 L55 62 Q55 71 66 71 L72 71"></path>
<path d="M65 63 L74 71 L65 79"></path>
</g>
</sc-if>
<sc-if value="{{ isSagittarius }}">
<g stroke="{{ ink }}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M28 72 L72 28"></path>
<path d="M72 28 L53 28"></path>
<path d="M72 28 L72 47"></path>

</g>

<sc-if value="{{ isCapricorn }}">
<g stroke="{{ ink }}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M26 34 L38 66"></path>
<path d="M38 66 L45 38 Q47 29 56 33 Q65 38 63 50"></path>
<circle cx="57" cy="61" r="9"></circle>
</g>
</sc-if>
<sc-if value="{{ isAquarius }}">
<g stroke="{{ ink }}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M24 45 Q31 33 38 45 Q45 57 52 45 Q59 33 66 45 Q71 54 76 47"></path>
<path d="M24 64 Q31 52 38 64 Q45 76 52 64 Q59 52 66 64 Q71 73 76 66"></path>
</g>
</sc-if>
<sc-if value="{{ isPisces }}">
<g stroke="{{ ink }}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M34 26 C21 39 21 61 34 74"></path>
<path d="M66 26 C79 39 79 61 66 74"></path>
<path d="M25 50 L75 50"></path>
</g>

<circle cx="82" cy="22" r="2.6" fill="{{ ink }}" opacity="0.55"></circle>
<circle cx="18" cy="76" r="1.9" fill="{{ ink }}" opacity="0.4"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;sign&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;aries&quot;,&quot;taurus&quot;,&quot;gemini&quot;,&quot;cancer&quot;,&quot;leo&quot;,&quot;virgo&quot;,&quot;libra&quot;,&quot;scorpio&quot;,&quot;sagittarius&quot;,&quot;capricorn&quot;,&quot;aquarius&quot;,&quot;pisces&quot;],&quot;default&quot;:&quot;cancer&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#FF7FB6&quot;,&quot;#B78CF5&quot;,&quot;#5FD3BC&quot;,&quot;#FF9576&quot;],&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
const SIGNS = {
  aries:       { el: 'fire',  vi: 'Bạch Dương', en: 'Aries' },
  taurus:      { el: 'earth', vi: 'Kim Ngưu',   en: 'Taurus' },
  gemini:      { el: 'air',   vi: 'Song Tử',    en: 'Gemini' },
  cancer:      { el: 'water', vi: 'Cự Giải',    en: 'Cancer' },
  leo:         { el: 'fire',  vi: 'Sư Tử',      en: 'Leo' },
  virgo:       { el: 'earth', vi: 'Xử Nữ',      en: 'Virgo' },
  libra:       { el: 'air',   vi: 'Thiên Bình', en: 'Libra' },
  scorpio:     { el: 'water', vi: 'Bọ Cạp',     en: 'Scorpio' },
  sagittarius: { el: 'fire',  vi: 'Nhân Mã',    en: 'Sagittarius' },
  capricorn:   { el: 'earth', vi: 'Ma Kết',     en: 'Capricorn' },
  aquarius:    { el: 'air',   vi: 'Bảo Bình',   en: 'Aquarius' },
  pisces:      { el: 'water', vi: 'Song Ngư',   en: 'Pisces' },
};
const EL = {
  fire:  { ink: '#FF9576', disc: 'rgba(255,149,118,.16)' },
  earth: { ink: '#5FD3BC', disc: 'rgba(95,211,188,.16)' },
  air:   { ink: '#B78CF5', disc: 'rgba(183,140,245,.18)' },
  water: { ink: '#FF7FB6', disc: 'rgba(255,127,182,.16)' },
};

class Component extends DCLogic {
  renderVals() {
    const s = SIGNS[this.props.sign] ? this.props.sign : 'cancer';
    const el = EL[SIGNS[s].el];
    const flat = this.props.flat;
    return {
      ink: this.props.color || el.ink,
      disc: flat ? 'transparent' : el.disc,
      isAries: s === 'aries', isTaurus: s === 'taurus', isGemini: s === 'gemini',
      isCancer: s === 'cancer', isLeo: s === 'leo', isVirgo: s === 'virgo',
      isLibra: s === 'libra', isScorpio: s === 'scorpio', isSagittarius: s === 'sagittarius',
      isCapricorn: s === 'capricorn', isAquarius: s === 'aquarius', isPisces: s === 'pisces',
    };
  }
}
</script>
</body>
</html>
