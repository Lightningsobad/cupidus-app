name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/scripts/vps-deploy.sh"
  workflow_dispatch:
    inputs:
      simulate_health_gate_failure:
        description: "AC7 negative rollback test only: deploy without the service-account.json mount so the container crashes before it listens. Revert immediately after the run."
        type: boolean
        default: false

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose -f backend/docker-compose.prod.yml config
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          POSTGRES_USER: placeholder
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: placeholder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-backend:${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/${{ github.repository }}-backend:latest

  deploy-and-verify:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS and run health gate
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
          SIMULATE_HEALTH_GATE_FAILURE: ${{ inputs.simulate_health_gate_failure || 'false' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ github.repository_owner }}
        run: |
          chmod +x .github/workflows/scripts/vps-deploy.sh
          .github/workflows/scripts/vps-deploy.sh
