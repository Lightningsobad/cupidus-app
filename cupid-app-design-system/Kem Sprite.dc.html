  renderVals() {
    const s = this.props.state || 'happy';
    return {
      isHappy: s === 'happy', isInlove: s === 'inlove', isNeutral: s === 'neutral',
      isSulk: s === 'sulk', isSick: s === 'sick', isSleep: s === 'sleep',

}
