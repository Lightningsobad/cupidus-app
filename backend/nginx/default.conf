server {
    listen 80;
    server_name api-cupid.tikup.me;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# STORY-001: production hostname, TLS terminated at this origin using a
# Cloudflare Origin CA certificate (zone SSL mode: Full (strict)). This is a
# new, additive server block; the api-cupid.tikup.me block above is untouched.
server {
    listen 443 ssl;
    server_name api.cupidus.app;

    ssl_certificate     /etc/nginx/certs/api.cupidus.app.pem;
    ssl_certificate_key /etc/nginx/certs/api.cupidus.app.key;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
