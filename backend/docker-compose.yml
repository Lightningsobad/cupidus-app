# Multi-project-safe local Compose file: no fixed container_name values (so
# names are project-scoped via COMPOSE_PROJECT_NAME), no fixed dependency
# host ports (so several generated projects can run on one machine without
# colliding). Invoke via scripts/setup.sh, which resolves and persists
# COMPOSE_PROJECT_NAME / *_HOST_PORT in the project-local .env file.
# The nginx service targets the external domain api-cupid.tikup.me and is a
# VPS/production concern; it is excluded from the local-dev path via the
# "vps" profile and only starts with `docker compose --profile vps up`.
services:
  postgres:
    # retired by devstack: this service now lives in the
    # shared stack (~/.devstack). Kept behind a profile so
    # `docker compose up` no longer starts a second copy.
    profiles: ["legacy"]
    image: postgres:16 # Using 16 as 18 is not stable/widely available yet, or just stick to 'latest'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-cupid}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # retired by devstack: this service now lives in the
    # shared stack (~/.devstack). Kept behind a profile so
    # `docker compose up` no longer starts a second copy.
    profiles: ["legacy"]
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cupid}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    profiles: ["vps"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # STORY-001: Origin CA cert/key for api.cupidus.app, provisioned
      # directly on the VPS (never committed — see .gitignore). Mounted
      # read-only.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
